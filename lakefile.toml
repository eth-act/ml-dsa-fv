name = "mldsa44"
version = "0.1.0"
defaultTargets = ["EvmProof", "MlDsa44", "MlDsa", "MlDsa65", "MlDsa87", "MlDsaOptCommon", "MlDsaOpt44", "MlDsaOpt65", "MlDsaOpt87"]

# Pins follow powdr-labs/eip8200-challenges@c165c97 so the vendored
# `EvmProof` infrastructure builds unchanged against the same semantics.

# Verified Yul→EVM compiler: produces the frozen reference bytecode.
[[require]]
name = "yul-evm-compiler"
git = "https://github.com/powdr-labs/yul-compiler"
rev = "c2e44cd2d487fd59b14897732189acc0c1724873"

[[require]]
name = "yul-semantics"
git = "https://github.com/powdr-labs/yul-semantics"
rev = "c9914c13df47efe026376723acd632bc33bc16e3"

# The EVM semantics the correctness theorem is stated against. Part of the
# trust boundary, so pinned explicitly. Temporarily: powdr-labs/evm-semantics
# 2f8714d plus the Glamsterdam patch (a partial `Amsterdam` fork: EIP-8024 and
# EIP-7954), vendored in deps/evm-semantics and pinned at the commit of this
# repository that added the patch (see deps/README.md). The yul packages
# below require the same package name and build against it too.
[[require]]
name = "evm_semantics"
git = "https://github.com/eth-act/ml-dsa-fv"
rev = "2e8a064f00cab4ba11799ccbed5bcaf7fcb349be"
subDir = "deps/evm-semantics"

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.33.0"

# Generic direct-bytecode proof infrastructure, vendored from
# powdr-labs/eip8200-challenges (Apache-2.0) with the namespace
# `Challenge.EvmProof` renamed to `EvmProof`.
[[lean_lib]]
name = "EvmProof"
# `EvmProof.Amsterdam`: what the semantics patch changes and what it does not.
roots = ["EvmProof", "EvmProof.Amsterdam"]

[[lean_lib]]
name = "MlDsa44"

# Developer tool: compiles the reference Yul, emits proof-facing artifacts,
# checks the spec against test vectors and runs the bytecode in the pinned
# semantics to measure gas.
[[lean_exe]]
name = "mldsa44tool"
root = "Tool"

# Parametric FIPS 204 spec and EIP-8355 statements (ML-DSA-44/65/87), the
# anchoring proof to the ML-DSA-44 spec, and the 65/87 statements.
[[lean_lib]]
name = "MlDsa"

[[lean_lib]]
name = "MlDsa65"

[[lean_lib]]
name = "MlDsa87"

# Developer tool for the parametric spec: spec checks for 44/65/87, bytecode
# runs on the 65/87 vectors, per-function gas profiles.
[[lean_exe]]
name = "mldsatool"
root = "MlDsaTool"

# Proofs about the gas-optimised hand-written bytecodes (MlDsaOpt/): the
# artifact-independent infrastructure, and the ML-DSA-44 artifact.
[[lean_lib]]
name = "MlDsaOptCommon"

[[lean_lib]]
name = "MlDsaOpt44"

# The ML-DSA-65 and ML-DSA-87 artifacts (kernels shared with ML-DSA-44 are
# ported from `MlDsaOpt44` by `scripts/proofgen_port.py`).
[[lean_lib]]
name = "MlDsaOpt65"

[[lean_lib]]
name = "MlDsaOpt87"
